<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مولد رقم BBAN 💸</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}
  
  body{
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    background:linear-gradient(135deg,#667eea 0%,#764ba2 50%,#8B5CF6 100%);
    background-attachment:fixed;
    padding:40px 20px;
    position:relative;
    overflow-x:hidden;
  }
  
  body::before,body::after{
    content:"";
    position:fixed;
    border-radius:50%;
    filter:blur(80px);
    opacity:0.6;
    z-index:0;
  }
  body::before{
    width:300px;height:300px;
    background:#A78BFA;
    top:-100px;left:-100px;
  }
  body::after{
    width:400px;height:400px;
    background:#C4B5FD;
    bottom:-150px;right:-150px;
  }
  
  .card{
    width:100%;
    max-width:480px;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.3);
    border-radius:32px;
    padding:32px 28px 70px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.25);
    position:relative;
    z-index:1;
  }
  
  .icon-box{
    width:80px;height:80px;
    margin:0 auto 16px;
    border-radius:50%;
    background:linear-gradient(135deg,#A78BFA,#7C3AED);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:38px;
    box-shadow:0 10px 30px rgba(124,58,237,0.5);
  }
  
  h1{
    font-size:24px;
    color:#fff;
    font-weight:800;
    text-shadow:0 2px 10px rgba(0,0,0,0.15);
  }
  
  .subtitle{
    font-size:13px;
    color:rgba(255,255,255,0.85);
    margin:8px 0 24px;
  }
  
  label{
    display:block;
    text-align:right;
    font-size:14px;
    font-weight:700;
    color:#fff;
    margin:16px 4px 8px;
    text-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  
  .neu-input,.select-selected,.iban-result{
    width:100%;
    padding:15px 18px;
    border:1px solid rgba(255,255,255,0.4);
    outline:none;
    border-radius:16px;
    background:rgba(255,255,255,0.9);
    font-size:16px;
    color:#1F2937;
    font-weight:600;
    transition:all 0.2s;
  }
  
  .neu-input:focus{
    border-color:#7C3AED;
    box-shadow:0 0 0 4px rgba(124,58,237,0.25);
  }
  
  .neu-input:disabled{
    background:rgba(255,255,255,0.5);
    color:#9ca3af;
  }
  
  .custom-select{
    position:relative;
    text-align:right;
  }
  
  .select-selected{
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:10px;
    position:relative;
    padding-left:40px;
  }
  
  .select-selected:after{
    content:"";
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    border:6px solid transparent;
    border-color:#7C3AED transparent transparent transparent;
    transition:transform 0.2s;
  }
  
  .select-selected.select-arrow-active:after{
    transform:translateY(-50%) rotate(180deg);
  }
  
  .select-items{
    position:absolute;
    top:110%;
    left:0;
    right:0;
    z-index:99;
    background:rgba(255,255,255,0.98);
    backdrop-filter:blur(20px);
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.3);
    overflow:hidden;
    max-height:280px;
    overflow-y:auto;
    border:1px solid rgba(124,58,237,0.2);
  }
  
  .select-items div{
    padding:14px 16px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:12px;
    font-size:14.5px;
    font-weight:600;
    color:#1F2937;
    transition:background 0.15s;
  }
  
  .select-items div:hover{
    background:rgba(124,58,237,0.1);
  }
  
  .select-hide{display:none!important;}
  
  .bank-icon{
    width:30px;height:30px;
    object-fit:contain;
    border-radius:50%;
    background:#fff;
    border:1px solid rgba(124,58,237,0.2);
  }
  
  .note{
    font-size:12px;
    color:#FCD34D;
    font-weight:700;
    margin-top:6px;
    min-height:16px;
    text-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  
  .btn-main{
    width:100%;
    padding:16px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#8B5CF6,#7C3AED);
    color:#fff;
    font-weight:800;
    font-size:16px;
    cursor:pointer;
    box-shadow:0 10px 30px rgba(124,58,237,0.5);
    margin-top:10px;
    transition:all 0.2s;
  }
  
  .btn-main:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 35px rgba(124,58,237,0.6);
  }
  
  .btn-main:active{
    transform:scale(0.97);
  }
  
  .result-box{
    margin-top:22px;
    padding:20px;
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,0.35);
    border-radius:20px;
    display:none;
  }
  
  .result-label{
    font-size:13px;
    color:#fff;
    font-weight:700;
    margin-bottom:8px;
    text-shadow:0 1px 4px rgba(0,0,0,0.15);
  }
  
  .iban-result{
    font-size:22px;
    font-weight:900;
    letter-spacing:3px;
    text-align:center;
    direction:ltr;
    background:#fff!important;
    box-shadow:0 0 0 3px #8B5CF6;
    cursor:pointer;
    color:#7C3AED;
  }
  
  .copy-btn{
    background:linear-gradient(135deg,#10B981,#059669);
    margin-top:12px;
    box-shadow:0 8px 20px rgba(16,185,129,0.4);
  }
  
  .copy-btn:hover{
    box-shadow:0 10px 25px rgba(16,185,129,0.55);
  }
  
  .copy-btn.copied{
    background:linear-gradient(135deg,#F59E0B,#D97706);
  }
  
  .success-msg{
    color:#6EE7B7;
    font-size:14px;
    font-weight:800;
    display:none;
    margin-top:10px;
    text-shadow:0 1px 4px rgba(0,0,0,0.2);
  }
  
  .footer{
    position:absolute;
    bottom:18px;
    left:0;
    right:0;
    text-align:center;
    font-size:12px;
    color:rgba(255,255,255,0.9);
    font-weight:600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="icon-box">💸</div>
  <h1>مولد رقم BBAN</h1>
  <p class="subtitle">برمجة وتصميم : عبدالله ودالعطا</p>

  <label>1. اختار البنك:</label>
  <div class="custom-select">
    <div class="select-selected" id="selected">-- اختار البنك --</div>
    <div class="select-items select-hide" id="items">
      <div data-prefix="040" data-suffix="0001" data-type="normal"><img src="images/01.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك الخرطوم - بنكك</div>
      <div data-prefix="150000" data-suffix="" data-type="mashreq"><img src="images/02.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك المشرق - مشرق</div>
      <div data-prefix="02" data-suffix="0001" data-type="normal"><img src="images/03.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك فيصل - فوري</div>
      <div data-prefix="14000" data-suffix="0001" data-type="normal"><img src="images/04.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> البنك الاسلامي - أمن بلص</div>
      <div data-prefix="" data-suffix="" data-type="sahil"><img src="images/05.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك النيل - ساهل</div>
      <div data-prefix="070" data-suffix="0001" data-type="normal"><img src="images/06.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك البركه - البركه</div>
      <div data-prefix="24" data-suffix="00001" data-type="normal"><img src="images/07.png" class="bank-icon" loading="eager" onerror="this.style.display='none'"> بنك ام درمان - اوكاش</div>
    </div>
    <input type="hidden" id="prefix">
    <input type="hidden" id="suffix">
    <input type="hidden" id="type">
  </div>

  <label>2. ادخل رقم الحساب:</label>
  <input type="number" inputmode="numeric" id="account" class="neu-input" placeholder="مثال: 1234567">
  <p class="note" id="note"></p>
  <button class="btn-main" id="genBtn">✨ توليد الرقم →</button>

  <div class="result-box" id="resultBox">
    <p class="result-label">الرقم الجاهز للنسخ:</p>
    <input type="text" class="iban-result" id="ibanResult" readonly>
    <button class="btn-main copy-btn" id="copyBtn">📋 نسخ الرقم</button>
    <p class="success-msg" id="successMsg">تم النسخ بنجاح ✓</p>
  </div>
  <div class="footer">برمجة وتصميم © عبدالله ودالعطا</div>
</div>

<script>
const selected=document.getElementById('selected'),
      items=document.getElementById('items'),
      pEl=document.getElementById('prefix'),
      sEl=document.getElementById('suffix'),
      tEl=document.getElementById('type'),
      acc=document.getElementById('account'),
      note=document.getElementById('note'),
      rBox=document.getElementById('resultBox'),
      iban=document.getElementById('ibanResult');

selected.addEventListener('click',e=>{
  e.stopPropagation();
  items.classList.toggle('select-hide');
  selected.classList.toggle('select-arrow-active');
});

document.querySelectorAll('#items div').forEach(d=>{
  d.addEventListener('click',()=>{
    selected.innerHTML=d.innerHTML;
    pEl.value=d.dataset.prefix;
    sEl.value=d.dataset.suffix;
    tEl.value=d.dataset.type;
    if(d.dataset.type==='sahil'){
      note.textContent='ملاحظة: رقم ساهل بيتجاب من داخل تطبيق بنك النيل فقط';
      acc.disabled=true;
      acc.value='';
    }else{
      note.textContent='';
      acc.disabled=false;
    }
    items.classList.add('select-hide');
    selected.classList.remove('select-arrow-active');
  });
});

document.addEventListener('click',()=>{
  items.classList.add('select-hide');
  selected.classList.remove('select-arrow-active');
});

function generate(){
  const p=pEl.value,s=sEl.value,t=tEl.value,a=acc.value.trim();
  if(t==='sahil'){alert('رقم ساهل بيتجاب من داخل التطبيق فقط');return;}
  if(!t){alert('اختار البنك اول');return;}
  if(!a){alert('ادخل رقم حساب صحيح');return;}
  iban.value=t==='mashreq'?p+a:p+a+s;
  rBox.style.display='block';
}

document.getElementById('genBtn').onclick=generate;

document.getElementById('copyBtn').onclick=function(){
  const b=this;
  const done=()=>{
    b.textContent='تم النسخ ✓';
    b.classList.add('copied');
    document.getElementById('successMsg').style.display='block';
    setTimeout(()=>{
      b.textContent='📋 نسخ الرقم';
      b.classList.remove('copied');
      document.getElementById('successMsg').style.display='none';
    },2000);
  };
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(iban.value).then(done);
  }else{
    iban.select();
    document.execCommand('copy');
    done();
  }
};

iban.addEventListener('click',function(){this.select();});
</script>
</body>
</html>
